<html lang="es" class="scroll-smooth">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Contacto y Soporte Académico | EstudiaPro</title>
    <meta name="description" content="Ponte en contacto con el equipo de EstudiaPro para dudas, reportes de preguntas o sugerencias de temarios.">
    <link rel="canonical" href="https://estudiapro.es/contacto.html">

    <!-- Fonts & Tailwind CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: { 500: '#2f8fff', 600: '#176ff5', 700: '#1056e1' }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans">
    
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl">
                <span class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white text-sm">🎓</span>
                <span>Estudia<span class="text-brand-600">Pro</span></span>
            </a>
            <a href="index.html" class="text-xs sm:text-sm font-semibold text-brand-600 dark:text-brand-400 hover:underline">
                ← Volver a los tests
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-2xl mx-auto px-4 py-12">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white">Contacto y Soporte</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400 mt-2">
                ¿Has detectado una errata legislativa en alguna pregunta o quieres solicitar un nuevo simulacro? Escríbenos.
            </p>
        </div>

        <form onsubmit="event.preventDefault(); alert('¡Gracias por tu mensaje! El equipo docente revisará tu consulta en menos de 24 horas.'); this.reset();" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm space-y-4">
            <div>
                <label for="contact-name" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Nombre</label>
                <input type="text" id="contact-name" required placeholder="Tu nombre o alias" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label for="contact-email" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input type="email" id="contact-email" required placeholder="tuemail@ejemplo.com" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label for="contact-topic" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Motivo de contacto</label>
                <select id="contact-topic" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="errata">Reportar posible errata en pregunta</option>
                    <option value="sugerencia">Sugerir nuevo tema o examen oficial</option>
                    <option value="publicidad">Consultas sobre publicidad / AdSense</option>
                    <option value="otro">Otra consulta</option>
                </select>
            </div>

            <div>
                <label for="contact-message" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Mensaje</label>
                <textarea id="contact-message" rows="4" required placeholder="Indica el ID de la pregunta o detalla tu comentario..." class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-md transition-colors">
                Enviar Mensaje
            </button>
        </form>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        © 2026 EstudiaPro Digital • <a href="index.html" class="hover:underline">Inicio</a> • <a href="politica-privacidad.html" class="hover:underline">Privacidad</a>
    </footer>
</body>
</html>
